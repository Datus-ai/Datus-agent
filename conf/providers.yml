# LLM Provider catalog for interactive init (`datus-cli init`)
# Add new providers/models here without changing Python code.

providers:
  openai:
    type: openai
    base_url: https://api.openai.com/v1
    default_model: gpt-4.1
    models:
      - gpt-5.2
      - gpt-4.1
      - gpt-4.1-mini
      - o3
      - o3-pro
      - o4-mini

  deepseek:
    type: deepseek
    base_url: https://api.deepseek.com
    default_model: deepseek-chat
    models:
      - deepseek-chat
      - deepseek-reasoner

  claude:
    type: claude
    base_url: https://api.anthropic.com
    default_model: claude-sonnet-4-5
    models:
      - claude-haiku-4-5
      - claude-sonnet-4-5
      - claude-opus-4-5
      - claude-sonnet-4
      - claude-opus-4

  kimi:
    type: kimi
    base_url: https://api.moonshot.cn/v1
    default_model: kimi-k2.5
    models:
      - kimi-k2.5
      - kimi-k2-turbo-preview
      - kimi-k2-0905-Preview
      - kimi-k2-thinking

  qwen:
    type: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    default_model: qwen3-max
    models:
      - qwen3-max
      - qwen3-coder-plus
      - qwen-plus
      - qwen-flash

  gemini:
    type: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    default_model: gemini-2.5-flash
    models:
      - gemini-2.5-flash
      - gemini-2.5-pro
      - gemini-3-flash-preview
      - gemini-3-pro-preview

  # Coding Plan providers (coding_plan: true enables User-Agent header prompt)
  alibaba_coding:
    type: claude
    base_url: https://coding-intl.dashscope.aliyuncs.com/apps/anthropic
    default_model: qwen3-coder-plus
    coding_plan: true
    models:
      - qwen3-coder-plus
      - qwen3.5-plus
      - glm-5
      - glm-4.7
      - kimi-k2.5
      - MiniMax-M2.5
      - claude-sonnet-4

  glm_coding:
    type: claude
    base_url: https://open.bigmodel.cn/api/anthropic
    default_model: glm-5
    coding_plan: true
    models:
      - glm-5
      - glm-4.7
      - glm-4.5-air
      - glm-4.5-flash
      - claude-sonnet-4

  minimax_coding:
    type: claude
    base_url: https://api.minimaxi.com/anthropic
    default_model: MiniMax-M2.7
    coding_plan: true
    models:
      - MiniMax-M2.7
      - claude-sonnet-4

  kimi_coding:
    type: claude
    base_url: https://api.kimi.com/coding/
    default_model: kimi-for-coding
    coding_plan: true
    models:
      - kimi-for-coding
      - claude-sonnet-4

# Model-specific parameter overrides
# Some models enforce fixed values; these are auto-applied during init.
model_overrides:
  kimi-k2.5:
    temperature: 1.0
    top_p: 0.95
  qwen3-coder-plus:
    temperature: 1.0
    top_p: 0.95
