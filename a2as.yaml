    commit: "51188730"
    scope: [datus/agent/node/gen_sql_agentic_node.py, datus/cli/agent_commands.py, datus/cli/bi_dashboard.py, datus/cli/chat_commands.py,
      datus/cli/generation_hooks.py, datus/cli/interactive_init.py, datus/cli/mcp_commands.py, datus/cli/plan_hooks.py, datus/cli/repl.py,
      datus/cli/screen/workflow_screen.py, datus/cli/tutorial.py, datus/configuration/agent_config.py, datus/main.py, datus/models/base.py,
      datus/models/claude_model.py, datus/models/mcp_result_extractors.py, datus/models/mcp_utils.py, datus/models/openai_compatible.py,
      datus/schemas/action_history.py, datus/schemas/node_models.py, datus/storage/embedding_models.py, datus/storage/reference_sql/store.py,
      datus/storage/schema_metadata/store.py, datus/tools/db_tools/__init__.py, datus/tools/func_tool/base.py, datus/tools/mcp_tools/mcp_config.py,
      datus/tools/mcp_tools/mcp_manager.py, datus/tools/mcp_tools/mcp_server.py, datus/utils/constants.py, datus/utils/exceptions.py,
      datus/utils/json_utils.py, datus/utils/loggings.py, datus/utils/path_manager.py, datus/utils/resource_utils.py, datus/utils/sql_utils.py,
      datus/utils/traceable_utils.py]
  issued:
    by: A2AS.org
    at: '2026-01-26T16:12:20Z'
  signatures:
    digest: sha256:radKjFzeT25nEO_OTBmRLYon6sZtrZeSM0HEkGWPOe4
    key: ed25519:zpKQ6dv-NvVVyBmchW3qOGlt88gZzF8qvbLS6XD_Ia4
    sig: ed25519:955rakR4MALr_02GwoZ46EAqXQUg5DigzQUxydb2ReExS83-YoPLKwVzMV-Kt4Ip2VEVL9DaHvcVSByqLv3BAw

agents:
  agent.0:
    type: instance
    models: [gpt-4.1]
    params:
      function: _run_tools_operation_async
      name: tools-agent-{server_name}
      instance: agent
  agent.1:
    type: instance
    models: [gpt-4.1]
    params:
      function: generate_with_mcp
      name: mcp-tools-agent
      instance: agent
  agent.2:
    type: instance
    models: [gpt-4.1]
    params:
      function: generate_with_mcp
      name: mcp-claude-agent
      instance: agent
  agent.3:
    type: instance
    models: [async_model]
    params:
      instructions: instruction
      output_type: output_type
      function: _generate_with_tools_internal
      instance: agent
  agent.4:
    type: instance
    models: [async_model]
    params:
      instructions: instruction
      output_type: output_type
      function: _generate_with_tools_stream_internal
      instance: agent
  agent.5:
    type: instance
    models: [async_model]
    params:
      function: _setup_async_agent
      name: kwargs.pop(agent_name, MCP_Agent)
      output_type: str
      instance: agent
      instructions: [instruction]
  agent.6:
    type: instance
    models: [async_model]
    params:
      instructions: instruction
      output_type: output_type
      function: _tools_operation
      instance: agent
  agent.7:
    type: instance
    models: [async_model]
    params:
      instructions: instruction
      output_type: output_type
      model_settings: model_settings
      function: _stream_operation
      instance: agent
  agent.8:
    type: instance
    models: [gpt-4.1]
    params:
      function: main
      instance: agent
  agent._create_agent_with_config:
    type: factory
    models: [gpt-4.1]
    params:
      function: _create_agent_with_config
  agent.create_agent:
    type: factory
    models: [gpt-4.1]
    params:
      function: create_agent
  agent.DatusCLI.agent:
    type: class
    models: [gpt-4.1]
    params:
      class: DatusCLI

models:
  async_model:
    type: variable
    agents: [agent.3, agent.4, agent.5, agent.6, agent.7]
  gpt-4.1:
    type: default
    agents: [agent.DatusCLI.agent, agent.0, agent.1, agent.2, agent.8, agent._create_agent_with_config, agent.create_agent]

tools:
  final_tool:
    type: wrapper
  tool_template:
    type: wrapper
    params:
      wraps: bound_method

mcp:
  server_instance.0:
    type: network
    params:
      class: MCPServerSse
      config: server_params
      client_session_timeout_seconds: "60"
      instance: server_instance
  server_instance.1:
    type: network
    params:
      class: MCPServerStreamableHttp
      config: server_params
      client_session_timeout_seconds: "60"
      instance: server_instance
      function: _create_http_server

