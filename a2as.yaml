  ./:
    type: pattern
    actions: [read]
    params:
      patterns: [agent.*.log, '\${([^}]+)}', '*.sql']
      caller: [_get_current_log_file, get_file_fuzzy_matches, do_init_sql_and_log_result]
      links: [pattern]
