<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Datus Report — __DATUS_REPORT_TITLE__</title>
  <link rel="stylesheet" href="__DATUS_REPORT_CSS_URL__" />
  <style>
    html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; }
    #root { min-height: 100vh; }
    .datus-report-fallback { padding: 32px; max-width: 880px; margin: 0 auto; line-height: 1.6; }
    .datus-report-fallback pre { background: #f4f4f5; padding: 12px; border-radius: 6px; overflow: auto; }
  </style>
</head>
<body>
  <div id="root">
    <div class="datus-report-fallback">
      <h2>Datus Report</h2>
      <p>Loading viewer from CDN…</p>
      <p>If this page stays blank, your environment cannot reach <code>unpkg.com</code>. The raw artifact is embedded below for offline inspection:</p>
      <pre id="datus-report-fallback-pre"></pre>
    </div>
  </div>

  <script type="application/json" id="datus-report-data">__DATUS_REPORT_DATA__</script>

  <script src="__DATUS_REPORT_JS_URL__"
          onerror="document.getElementById('datus-report-fallback-pre').textContent = document.getElementById('datus-report-data').textContent;"></script>
  <script>
    (function () {
      if (window.DatusReport && typeof window.DatusReport.initReport === 'function') {
        window.DatusReport.initReport({
          rootId: 'root',
          dataScriptId: 'datus-report-data'
        });
      } else {
        var pre = document.getElementById('datus-report-fallback-pre');
        if (pre) pre.textContent = document.getElementById('datus-report-data').textContent;
      }
    })();
  </script>
</body>
</html>
