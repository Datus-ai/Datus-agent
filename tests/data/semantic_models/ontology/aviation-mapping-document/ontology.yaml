# Aviation scenario — the same world as model.yaml, in Apache Ossie ontology
# form (ontology spec 0.2.0.dev0). Translated from the Palantir-style IR of
# the Aviation / Flight Alert reconstruction pack by the rules in
# design/palantir-vs-ossie-ontology-concepts.zh.md §4.
#
# Validate with the upstream validator:
#   python validation/validate.py fixtures/aviation/ontology.yaml \
#       --schema ontology/ontology.json          (run inside an apache/ossie checkout)
#
# This file is the ontology only. mapping.yaml maps it onto model.yaml; load
# the three with `dosi --mapping fixtures/aviation/mapping.yaml`.
#
# Translation decisions worth knowing:
#   * Palantir one-to-many links (Flight.has_delay, has_alert, has_sensor) are
#     declared on the many side (Delay.flight, FlightAlert.flight,
#     FlightSensor.flight) with ManyToOne — Ossie has no one-to-many spelling.
#   * departs_from / arrives_at name their Airport role (origin / destination)
#     so verbalizations and future expressions can tell the two apart.
#   * FlightSensor is identified by its series id (the key readings reference),
#     the sensor id is kept as a OneToOne relationship.
#   * The sensor object's time-series capability, Palantir object "kinds", and
#     the Action / Function layer have no Ossie form and are left out on
#     purpose; the gap is recorded, not hidden.
#   * `derived_by` expressions follow the grammar of the upstream flights.yaml
#     example; no engine evaluates them yet (M5).
version: 0.2.0.dev0
name: Aviation
description: >
  Flights operated by aircraft for carriers between airports along routes,
  with their delays, operational alerts and on-board sensor series.
  Research reconstruction of Palantir's public Aviation reference ontology.
requires:
  - COUNT[Airport] > 0
  - COUNT[Carrier] > 0
ontology:
# ---------------------------------------------------------------- value types
- concept: FlightId
  type: ValueType
  extends: [ String ]
- concept: FlightNumber
  type: ValueType
  extends: [ String ]
- concept: AircraftId
  type: ValueType
  extends: [ String ]
- concept: TailNumber
  type: ValueType
  extends: [ String ]
- concept: CarrierId
  type: ValueType
  extends: [ String ]
- concept: IataCode
  description: "Two-letter IATA carrier designator"
  type: ValueType
  extends: [ String ]
- concept: AirportCode
  description: "Three-letter IATA airport code"
  type: ValueType
  extends: [ String ]
- concept: RouteId
  type: ValueType
  extends: [ String ]
- concept: SensorId
  type: ValueType
  extends: [ String ]
- concept: SeriesId
  description: "Identifier of a time series in the sensor store"
  type: ValueType
  extends: [ String ]
- concept: AlertId
  type: ValueType
  extends: [ String ]
- concept: DelayId
  type: ValueType
  extends: [ String ]
- concept: NrMinutes
  type: ValueType
  extends: [ Integer ]
- concept: NrMiles
  type: ValueType
  extends: [ Integer ]
- concept: PassengerCount
  type: ValueType
  extends: [ Integer ]
  requires: [ PassengerCount >= 0 ]
- concept: FlightStatus
  type: ValueType
  extends: [ String ]
- concept: DelayType
  type: ValueType
  extends: [ String ]
  requires: [ "DelayType == 'AIR_TRAFFIC' OR DelayType == 'WEATHER' OR DelayType == 'MAINTENANCE' OR DelayType == 'CREW'" ]
- concept: AlertType
  type: ValueType
  extends: [ String ]
- concept: AlertPriority
  type: ValueType
  extends: [ String ]
  requires: [ "AlertPriority == 'P0' OR AlertPriority == 'P1' OR AlertPriority == 'P2' OR AlertPriority == 'P3'" ]
- concept: AlertStatus
  type: ValueType
  extends: [ String ]
  requires: [ "AlertStatus == 'OPEN' OR AlertStatus == 'RESOLVED'" ]
- concept: SeriesName
  type: ValueType
  extends: [ String ]
- concept: UnitName
  type: ValueType
  extends: [ String ]
- concept: ReadingValue
  type: ValueType
  extends: [ Float ]
- concept: CityName
  type: ValueType
  extends: [ String ]
- concept: TimezoneName
  type: ValueType
  extends: [ String ]
# --------------------------------------------------------------- entity types
- concept: Airport
  type: EntityType
  identify_by: [ code ]
  relationships:
  - name: code
    roles: [ { concept: AirportCode } ]
    multiplicity: OneToOne
    verbalizes: [ '{Airport} is identified by {AirportCode}' ]
  - name: name
    roles: [ { concept: String } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Airport} is named {String}' ]
  - name: city
    roles: [ { concept: CityName } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Airport} serves {CityName}' ]
  - name: timezone
    roles: [ { concept: TimezoneName } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Airport} keeps time in {TimezoneName}' ]
- concept: Carrier
  type: EntityType
  identify_by: [ id ]
  relationships:
  - name: id
    roles: [ { concept: CarrierId } ]
    multiplicity: OneToOne
    verbalizes: [ '{Carrier} is identified by {CarrierId}' ]
  - name: iata_code
    roles: [ { concept: IataCode } ]
    multiplicity: OneToOne
    verbalizes: [ '{Carrier} is designated {IataCode}' ]
  - name: name
    roles: [ { concept: String } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Carrier} is named {String}' ]
- concept: Aircraft
  type: EntityType
  identify_by: [ id ]
  relationships:
  - name: id
    roles: [ { concept: AircraftId } ]
    multiplicity: OneToOne
    verbalizes: [ '{Aircraft} is identified by {AircraftId}' ]
  - name: tail_number
    roles: [ { concept: TailNumber } ]
    multiplicity: OneToOne
    verbalizes: [ '{Aircraft} carries registration {TailNumber}' ]
  - name: model
    roles: [ { concept: String } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Aircraft} is a {String}' ]
  - name: in_service
    verbalizes: [ '{Aircraft} is in service' ]
- concept: Route
  type: EntityType
  identify_by: [ id ]
  relationships:
  - name: id
    roles: [ { concept: RouteId } ]
    multiplicity: OneToOne
    verbalizes: [ '{Route} is identified by {RouteId}' ]
  - name: origin
    roles: [ { concept: Airport, name: origin } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Route} starts at {Airport:origin}' ]
  - name: destination
    roles: [ { concept: Airport, name: destination } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Route} ends at {Airport:destination}' ]
  - name: distance
    roles: [ { concept: NrMiles } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Route} spans {NrMiles}' ]
- concept: Flight
  type: EntityType
  identify_by: [ id ]
  relationships:
  - name: id
    roles: [ { concept: FlightId } ]
    multiplicity: OneToOne
    verbalizes: [ '{Flight} is identified by {FlightId}' ]
  - name: number
    roles: [ { concept: FlightNumber } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} flies as {FlightNumber}' ]
  - name: operated_by
    roles: [ { concept: Aircraft } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} is operated by {Aircraft}' ]
  - name: flown_by
    roles: [ { concept: Carrier } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} is flown by {Carrier}' ]
  - name: follows_route
    roles: [ { concept: Route } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} follows {Route}' ]
  - name: departs_from
    roles: [ { concept: Airport, name: origin } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} departs from {Airport:origin}' ]
    requires: [ 'Flight.follows_route.origin == origin' ]
  - name: arrives_at
    roles: [ { concept: Airport, name: destination } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} arrives at {Airport:destination}' ]
    requires: [ 'Flight.follows_route.destination == destination' ]
  - name: scheduled_departure
    roles: [ { concept: DateTime } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} is scheduled to depart at {DateTime}' ]
  - name: actual_departure
    roles: [ { concept: DateTime } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} departed at {DateTime}' ]
  - name: scheduled_arrival
    roles: [ { concept: DateTime } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} is scheduled to arrive at {DateTime}' ]
  - name: actual_arrival
    roles: [ { concept: DateTime } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} arrived at {DateTime}' ]
  - name: passengers
    roles: [ { concept: PassengerCount } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} carried {PassengerCount} passengers' ]
  - name: status
    roles: [ { concept: FlightStatus } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} has status {FlightStatus}' ]
  - name: departure_delay
    roles: [ { concept: NrMinutes } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} departed {NrMinutes} late' ]
    derived_by: [ 'NrMinutes == MINUTES(Flight.actual_departure - Flight.scheduled_departure)' ]
  - name: arrival_delay
    roles: [ { concept: NrMinutes } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} arrived {NrMinutes} late' ]
    derived_by: [ 'NrMinutes == MINUTES(Flight.actual_arrival - Flight.scheduled_arrival)' ]
  - name: total_recorded_delay
    roles: [ { concept: NrMinutes } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Flight} accumulated {NrMinutes} of recorded delay' ]
    derived_by: [ 'NrMinutes == SUM[Delay.minutes WHERE Delay.flight(Flight) GROUP BY Flight]' ]
- concept: Delay
  type: EntityType
  identify_by: [ id ]
  relationships:
  - name: id
    roles: [ { concept: DelayId } ]
    multiplicity: OneToOne
    verbalizes: [ '{Delay} is identified by {DelayId}' ]
  - name: flight
    roles: [ { concept: Flight } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Delay} was recorded on {Flight}', '{Flight} has delay {Delay}' ]
  - name: type
    roles: [ { concept: DelayType } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Delay} is of type {DelayType}' ]
  - name: minutes
    roles: [ { concept: NrMinutes } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Delay} lasted {NrMinutes}' ]
  - name: cause
    roles: [ { concept: String } ]
    multiplicity: ManyToOne
    verbalizes: [ '{Delay} was caused by {String}' ]
- concept: FlightAlert
  type: EntityType
  identify_by: [ id ]
  relationships:
  - name: id
    roles: [ { concept: AlertId } ]
    multiplicity: OneToOne
    verbalizes: [ '{FlightAlert} is identified by {AlertId}' ]
  - name: flight
    roles: [ { concept: Flight } ]
    multiplicity: ManyToOne
    verbalizes: [ '{FlightAlert} was raised on {Flight}', '{Flight} has operational alert {FlightAlert}' ]
  - name: type
    roles: [ { concept: AlertType } ]
    multiplicity: ManyToOne
    verbalizes: [ '{FlightAlert} is of type {AlertType}' ]
  - name: priority
    roles: [ { concept: AlertPriority } ]
    multiplicity: ManyToOne
    verbalizes: [ '{FlightAlert} has priority {AlertPriority}' ]
  - name: status
    roles: [ { concept: AlertStatus } ]
    multiplicity: ManyToOne
    verbalizes: [ '{FlightAlert} is {AlertStatus}' ]
  - name: created_at
    roles: [ { concept: DateTime } ]
    multiplicity: ManyToOne
    verbalizes: [ '{FlightAlert} was created at {DateTime}' ]
  - name: resolved_at
    roles: [ { concept: DateTime } ]
    multiplicity: ManyToOne
    verbalizes: [ '{FlightAlert} was resolved at {DateTime}' ]
  - name: resolution_comment
    roles: [ { concept: String } ]
    multiplicity: ManyToOne
    verbalizes: [ '{FlightAlert} was resolved with comment- {String}' ]
- concept: FlightSensor
  description: "One sensor series recorded on board a flight (Palantir sensor object type)"
  type: EntityType
  identify_by: [ series ]
  relationships:
  - name: series
    roles: [ { concept: SeriesId } ]
    multiplicity: OneToOne
    verbalizes: [ '{FlightSensor} records series {SeriesId}' ]
  - name: id
    roles: [ { concept: SensorId } ]
    multiplicity: OneToOne
    verbalizes: [ '{FlightSensor} is identified by {SensorId}' ]
  - name: flight
    roles: [ { concept: Flight } ]
    multiplicity: ManyToOne
    verbalizes: [ '{FlightSensor} is mounted on {Flight}', '{Flight} has sensor series {FlightSensor}' ]
  - name: name
    roles: [ { concept: SeriesName } ]
    multiplicity: ManyToOne
    verbalizes: [ '{FlightSensor} measures {SeriesName}' ]
  - name: unit
    roles: [ { concept: UnitName } ]
    multiplicity: ManyToOne
    verbalizes: [ '{FlightSensor} reports in {UnitName}' ]
- concept: SensorReading
  description: "One point of a sensor series; identified by the sensor and the timestamp"
  type: EntityType
  identify_by: [ sensor, at ]
  relationships:
  - name: sensor
    roles: [ { concept: FlightSensor } ]
    multiplicity: ManyToOne
    verbalizes: [ '{SensorReading} belongs to {FlightSensor}' ]
  - name: at
    roles: [ { concept: DateTime } ]
    multiplicity: ManyToOne
    verbalizes: [ '{SensorReading} was taken at {DateTime}' ]
  - name: value
    roles: [ { concept: ReadingValue } ]
    multiplicity: ManyToOne
    verbalizes: [ '{SensorReading} measured {ReadingValue}' ]
