version: 0.2.0.dev0
semantic_model:
- name: frpm_model
  datasets:
  - name: frpm
    source: main.frpm
    primary_key:
    - CDSCode
    fields:
    - name: CDSCode
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CDSCode
    - name: enrollment_k12
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"Enrollment (K-12)"'
    - name: free_meal_count_k12
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"Free Meal Count (K-12)"'
    - name: frpm_count_k12
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"FRPM Count (K-12)"'
  metrics:
  - name: school_count
    description: Distinct schools
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT frpm.CDSCode)
    custom_extensions:
    - vendor_name: DATUS
      data: '{"v":"1.4","dataset":"frpm"}'
  - name: total_enrollment_k12
    description: Total K-12 enrollment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(frpm.enrollment_k12)
    custom_extensions:
    - vendor_name: DATUS
      data: '{"v":"1.4","dataset":"frpm"}'
  - name: free_meal_count_k12
    description: Free meals
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(frpm.free_meal_count_k12)
    custom_extensions:
    - vendor_name: DATUS
      data: '{"v":"1.4","dataset":"frpm"}'
  - name: frpm_count_k12
    description: FRPM count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(frpm.frpm_count_k12)
    custom_extensions:
    - vendor_name: DATUS
      data: '{"v":"1.4","dataset":"frpm"}'
