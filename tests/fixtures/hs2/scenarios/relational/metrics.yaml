- id: metrics.null_negated
  capabilities:
  - query.nulls
  targets:
  - hive
  - inceptor
  query:
    metrics:
    - order_count
    where_sql: NOT (orders.label IS NOT DISTINCT FROM '中文')
  expected:
    columns:
    - order_count
    rows:
    - - 2
    types:
    - int
    ordered: false
