model: model.yaml
cases:
- id: metrics.totals
  capabilities:
  - metrics.core
  targets:
  - hive
  - inceptor
  query:
    metrics:
    - revenue
    - order_count
    - unique_customers
    - avg_order_value
  expected:
    columns:
    - revenue
    - order_count
    - unique_customers
    - avg_order_value
    rows:
    - - '30.50'
      - 4
      - 2
      - '7.625'
    types:
    - decimal
    - int
    - int
    - decimal
    ordered: false
- id: metrics.label_groups
  capabilities:
  - metrics.core
  targets:
  - hive
  - inceptor
  query:
    metrics:
    - revenue
    - order_count
    group_by:
    - field: orders.label
  expected:
    columns:
    - label
    - revenue
    - order_count
    rows:
    - - 中文
      - '30.50'
      - 2
    - - English
      - '0'
      - 1
    - - null
      - null
      - 1
    types:
    - text
    - decimal
    - int
    ordered: false
- id: metrics.join_unmatched
  capabilities:
  - metrics.joins
  targets:
  - hive
  - inceptor
  query:
    metrics:
    - revenue
    - order_count
    group_by:
    - field: customers.region
  expected:
    columns:
    - region
    - revenue
    - order_count
    rows:
    - - 北区
      - '30.50'
      - 2
    - - 南区
      - '0'
      - 1
    - - null
      - null
      - 1
    types:
    - text
    - decimal
    - int
    ordered: false
- id: metrics.multidataset
  capabilities:
