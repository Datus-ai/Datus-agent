    rows:
    - - '2024-02-29'
    types:
    - date
    ordered: false
- id: metrics.running_revenue
  capabilities:
  - metrics.windows
  targets:
  - hive
  - inceptor
  query:
    metrics:
    - running_revenue
    group_by:
    - field: orders.order_date
      grain: month
  expected:
    columns:
    - order_date__month
    - running_revenue
    rows:
    - - '2024-01-01'
      - '30.50'
    - - '2024-02-01'
      - '30.50'
    types:
    - date
    - decimal
    ordered: false
