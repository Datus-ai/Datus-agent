cases:
- id: standard.typed_orc
  capabilities:
  - types.standard
  targets:
  - hive
  - inceptor
  sql: SELECT id, label, nullable_text, day_value, ts_value, amount, flag FROM {{db}}.typed_values ORDER BY id
  expected:
    columns:
    - id
    - label
    - nullable_text
    - day_value
    - ts_value
    - amount
    - flag
    rows:
    - - 1
      - 中文
      - null
      - '2024-02-29'
      - '2024-02-29 12:34:56.123'
      - '1234567890123456789012345678.1234567890'
      - true
    - - 2
      - ''
      - present
      - '2024-03-01'
      - '2024-03-01 00:00:00'
      - '-0.0000000001'
      - false
    types:
    - int
    - text
    - text
    - date
    - timestamp
    - decimal
    - bool
    ordered: true
  expected_by_profile:
    inceptor_ce_v1: &id001
      columns:
      - id
      - label
      - nullable_text
      - day_value
      - ts_value
      - amount
      - flag
      rows:
      - - 1
        - 中文
        - null
        - '2024-02-29'
        - '2024-02-29 12:34:56.123'
        - '1234567890123456789012345678.1234567890'
        - true
      - - 2
        - null
        - present
        - '2024-03-01'
        - '2024-03-01 00:00:00'
        - '-0.0000000001'
        - false
      types:
      - int
      - text
      - text
      - date
      - timestamp
      - decimal
      - bool
      ordered: true
    inceptor_ce_v2: *id001
    inceptor_ce_v2_non_utc: *id001
- id: standard.unicode_formats
  capabilities:
  - types.standard
  targets:
  - hive
  - inceptor
  sql: 'SELECT CAST(''中文,引号"和换行

    第二行'' AS STRING) AS label'
  expected:
    columns:
    - label
    rows:
    - - '中文,引号"和换行

        第二行'
    types:
    - text
    ordered: false
  formats:
  - list
  - csv
  - pandas
  - arrow
- id: numeric.rounding
  capabilities:
  - types.exact_numeric
  targets:
  - hive
  - inceptor
  sql: SELECT CAST('123.456' AS DECIMAL(5,2)) AS rounded, CAST('1234' AS DECIMAL(5,2)) AS overflowed
  expected:
    columns:
    - rounded
    - overflowed
    rows:
    - - '123.46'
      - null
    types:
    - decimal
    - decimal
    ordered: false
- id: numeric.int64
  capabilities:
  - types.exact_numeric
  targets:
  - hive
  - inceptor
  sql: SELECT CAST(9007199254740993 AS BIGINT) AS n
  expected:
    columns:
    - n
    rows:
    - - 9007199254740993
    types:
    - int
    ordered: false
- id: standard.char_padding
  capabilities:
  - types.standard
  targets:
  - hive
  - inceptor
  sql: SELECT CAST('a' AS CHAR(4)) AS padded, CAST('a ' AS VARCHAR(4)) AS varying_value
  expected:
    columns:
    - padded
    - varying_value
    rows:
    - - 'a   '
      - 'a '
    types:
    - text
    - text
    ordered: false
  expected_by_profile:
    inceptor_ce_v1: &id002
      columns:
      - padded
      - varying_value
      rows:
      - - 'a   '
        - a
      types:
      - text
      - text
      ordered: false
    inceptor_ce_v2: *id002
    inceptor_ce_v2_non_utc: *id002
- id: standard.binary
  capabilities:
  - types.standard
  targets:
  - hive
  - inceptor
  sql: SELECT UNHEX('00FF41') AS payload
  expected:
    columns:
    - payload
    rows:
    - - base64:AP9B
    types:
    - binary
    ordered: false
- id: standard.complex
  capabilities:
  - types.standard
  targets:
  - hive
  - inceptor
  sql: SELECT SIZE(ARRAY(1,2)) AS array_size, NAMED_STRUCT('x',1).x AS struct_value, MAP('k',2)['k'] AS map_value
  expected:
    columns:
    - array_size
    - struct_value
    - map_value
    rows:
    - - 2
      - 1
      - 2
    types:
    - int
    - int
    - int
    ordered: false
