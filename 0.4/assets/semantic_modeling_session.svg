<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace">
  <style>
    .win{fill:#171a23;stroke:#2c3040;stroke-width:1}
    .bar{fill:#1f2330}
    .ttl{fill:#7d8598;font-size:12px}
    .prompt{fill:#4ade80;font-size:13px;font-weight:600}
    .q{fill:#e6e9f0;font-size:13px}
    .tool{fill:#8ea3c8;font-size:13px}
    .fn{fill:#c4b5fd}
    .dim{fill:#7d8598;font-size:12px}
    .ok{fill:#4ade80;font-size:12px}
    .card{fill:#20242f;stroke:#343a4c;stroke-width:1}
    .rt{fill:#c4b5fd;font-size:13px;font-weight:700}
    .k{fill:#7d8598;font-size:13px}
    .v{fill:#e6e9f0;font-size:13px}
    .hl{fill:#4ade80;font-size:13px;font-weight:600}
    .cur{fill:#4ade80}
    .s1{animation:k1 14s linear infinite}
    .s2{animation:k2 14s linear infinite}
    .s4{animation:k4 14s linear infinite}
    .s5{animation:k5 14s linear infinite}
    .blink{animation:blinkc 1.1s steps(1) infinite}
    @keyframes k1{0%,2%{opacity:0}4.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k2{0%,7%{opacity:0}10%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k4{0%,13%{opacity:0}18%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k5{0%,20%{opacity:0}23%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes blinkc{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.s1,.s2,.s4,.s5,.blink{animation:none}}
  </style>

  <rect class="win" x="1" y="1" width="758" height="386" rx="12"/>
  <path class="bar" d="M1 13 A12 12 0 0 1 13 1 H747 A12 12 0 0 1 759 13 V40 H1 Z"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text class="ttl" x="380" y="25" text-anchor="middle">datus</text>

  <g class="s1">
    <text x="28" y="72"><tspan class="prompt">Datus&gt;</tspan><tspan class="q" dx="8">/bootstrap</tspan></text>
  </g>

  <g class="s2">
    <text class="tool" x="28" y="106">&#9210; <tspan class="fn">semantic_modeling</tspan>(success_story.csv)</text>
    <text class="ok" x="672" y="106">&#10003;</text>
    <text class="dim" x="46" y="128">mining datasets, relationships, and metrics from schema and SQL history</text>
  </g>

  <g class="s4">
    <rect class="card" x="28" y="150" width="704" height="172" rx="8"/>
    <text class="rt" x="52" y="180">Semantic Model &#183; california_schools</text>
    <line x1="52" y1="194" x2="708" y2="194" stroke="#343a4c" stroke-width="1"/>
    <text x="52" y="222"><tspan class="k">Datasets</tspan><tspan class="v" x="248">frpm &#183; satscores &#183; schools</tspan></text>
    <text x="52" y="250"><tspan class="k">Metrics</tspan><tspan class="v" x="248">average_sat_score &#183; excellence_rate &#183; free_meal_rate</tspan></text>
    <text x="52" y="278"><tspan class="k">Validation</tspan><tspan class="hl" x="248">keys verified &#10003;</tspan><tspan class="v" x="440">OSI format</tspan></text>
    <text class="ttl" x="52" y="306">compiled to SQL for 13+ dialects by the Dosi engine</text>
  </g>

  <g class="s5">
    <text class="prompt" x="28" y="358">Datus&gt;</text>
    <rect class="blink cur" x="92" y="346" width="8" height="15"/>
  </g>
</svg>
