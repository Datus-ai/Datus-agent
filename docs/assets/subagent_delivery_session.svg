<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace">
  <style>
    .win{fill:#171a23;stroke:#2c3040;stroke-width:1}
    .bar{fill:#1f2330}
    .ttl{fill:#7d8598;font-size:12px}
    .prompt{fill:#4ade80;font-size:13px;font-weight:600}
    .q{fill:#e6e9f0;font-size:13px}
    .dim{fill:#7d8598;font-size:12px}
    .card{fill:#20242f;stroke:#343a4c;stroke-width:1}
    .rt{fill:#c4b5fd;font-size:13px;font-weight:700}
    .pill{fill:#2a2f3e;stroke:#3d4356;stroke-width:1}
    .pt{fill:#e6e9f0;font-size:12px}
    .cur{fill:#4ade80}
    .s1{animation:k1 14s linear infinite}
    .s2{animation:k2 14s linear infinite}
    .s4{animation:k4 14s linear infinite}
    .s5{animation:k5 14s linear infinite}
    .blink{animation:blinkc 1.1s steps(1) infinite}
    @keyframes k1{0%,2%{opacity:0}4.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k2{0%,7%{opacity:0}10%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k4{0%,13%{opacity:0}18%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k5{0%,20%{opacity:0}23%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes blinkc{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.s1,.s2,.s4,.s5,.blink{animation:none}}
  </style>

  <rect class="win" x="1" y="1" width="758" height="342" rx="12"/>
  <path class="bar" d="M1 13 A12 12 0 0 1 13 1 H747 A12 12 0 0 1 759 13 V40 H1 Z"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text class="ttl" x="380" y="25" text-anchor="middle">datus</text>

  <g class="s1">
    <text x="28" y="72"><tspan class="prompt">Datus&gt;</tspan><tspan class="q" dx="8">/agent datus_schools_context</tspan></text>
    <text class="dim" x="46" y="94">active agent switched &#183; tools: context_search_tools, db_tools</text>
  </g>

  <g class="s2">
    <text x="28" y="128"><tspan class="prompt">&gt;</tspan><tspan class="q" dx="8">What's the average SAT score by school type?</tspan></text>
    <text class="dim" x="46" y="150">answered from curated context: metrics, reference SQL, business rules</text>
  </g>

  <g class="s4">
    <rect class="card" x="28" y="174" width="704" height="118" rx="8"/>
    <text class="rt" x="52" y="204">The same subagent, served everywhere</text>
    <line x1="52" y1="218" x2="708" y2="218" stroke="#343a4c" stroke-width="1"/>
    <rect class="pill" x="52" y="234" width="46" height="26" rx="13"/>
    <text class="pt" x="75" y="251" text-anchor="middle">CLI</text>
    <rect class="pill" x="110" y="234" width="52" height="26" rx="13"/>
    <text class="pt" x="136" y="251" text-anchor="middle">Web</text>
    <rect class="pill" x="174" y="234" width="88" height="26" rx="13"/>
    <text class="pt" x="218" y="251" text-anchor="middle">REST API</text>
    <rect class="pill" x="274" y="234" width="52" height="26" rx="13"/>
    <text class="pt" x="300" y="251" text-anchor="middle">MCP</text>
    <rect class="pill" x="338" y="234" width="118" height="26" rx="13"/>
    <text class="pt" x="397" y="251" text-anchor="middle">Slack / Feishu</text>
    <rect class="pill" x="468" y="234" width="76" height="26" rx="13"/>
    <text class="pt" x="506" y="251" text-anchor="middle">VS Code</text>
    <text class="ttl" x="52" y="282">one backend, one body of context behind every entry point</text>
  </g>

  <g class="s5">
    <text class="prompt" x="28" y="322">Datus&gt;</text>
    <rect class="blink cur" x="92" y="310" width="8" height="15"/>
  </g>
</svg>
