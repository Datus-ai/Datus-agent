<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-label="Datus architecture: delivery surfaces on top, the agent intelligence layer in the middle grounded in the context engine below, executing against databases, BI, schedulers, and LLM providers; feedback flows back into context.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .band { fill: #f6f8fa; stroke: #d0d7de; }
    .band-accent { fill: #f4f1fd; stroke: #c9bcf5; }
    .chip { fill: #ffffff; stroke: #d0d7de; }
    .chip-accent { fill: #ffffff; stroke: #c9bcf5; }
    .label { fill: #57606a; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
    .label-accent { fill: #654FF0; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
    .title { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .sub { fill: #57606a; font-size: 11px; }
    .flow { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .flow-accent { stroke: #654FF0; stroke-width: 1.5; fill: none; }
    .flowlabel { fill: #57606a; font-size: 11px; }
    .flowlabel-accent { fill: #654FF0; font-size: 11px; }
    .arrow { fill: #8c959f; }
    .arrow-accent { fill: #654FF0; }
    @media (prefers-color-scheme: dark) {
      .band { fill: #161b22; stroke: #30363d; }
      .band-accent { fill: #1c1832; stroke: #4c3d8f; }
      .chip { fill: #0d1117; stroke: #30363d; }
      .chip-accent { fill: #0d1117; stroke: #4c3d8f; }
      .label { fill: #8b949e; }
      .label-accent { fill: #a78bfa; }
      .title { fill: #e6edf3; }
      .sub { fill: #8b949e; }
      .flow { stroke: #6e7681; }
      .flow-accent { stroke: #a78bfa; }
      .flowlabel { fill: #8b949e; }
      .flowlabel-accent { fill: #a78bfa; }
      .arrow { fill: #6e7681; }
      .arrow-accent { fill: #a78bfa; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" class="arrow"/>
    </marker>
    <marker id="ah-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" class="arrow-accent"/>
    </marker>
  </defs>

  <!-- ===== Delivery layer ===== -->
  <rect x="60" y="20" width="880" height="100" rx="10" class="band"/>
  <text x="76" y="44" class="label">DELIVERY · HOW TEAMS REACH THE AGENT</text>
  <g>
    <rect x="76" y="58" width="132" height="44" rx="8" class="chip"/>
    <text x="142" y="84" text-anchor="middle" class="title">CLI</text>
    <rect x="218" y="58" width="132" height="44" rx="8" class="chip"/>
    <text x="284" y="78" text-anchor="middle" class="title">Web Chatbot</text>
    <text x="284" y="94" text-anchor="middle" class="sub">:8501</text>
    <rect x="360" y="58" width="132" height="44" rx="8" class="chip"/>
    <text x="426" y="78" text-anchor="middle" class="title">REST API</text>
    <text x="426" y="94" text-anchor="middle" class="sub">:8000</text>
    <rect x="502" y="58" width="132" height="44" rx="8" class="chip"/>
    <text x="568" y="84" text-anchor="middle" class="title">MCP</text>
    <rect x="644" y="58" width="132" height="44" rx="8" class="chip"/>
    <text x="710" y="78" text-anchor="middle" class="title">IM Gateway</text>
    <text x="710" y="94" text-anchor="middle" class="sub">Slack · Feishu</text>
    <rect x="786" y="58" width="132" height="44" rx="8" class="chip"/>
    <text x="852" y="78" text-anchor="middle" class="title">VS Code</text>
    <text x="852" y="94" text-anchor="middle" class="sub">Datus Studio</text>
  </g>

  <!-- Delivery <-> Intelligence -->
  <line x1="430" y1="120" x2="430" y2="158" class="flow" marker-end="url(#ah)"/>
  <text x="420" y="144" text-anchor="end" class="flowlabel">questions · tasks</text>
  <line x1="570" y1="158" x2="570" y2="120" class="flow" marker-end="url(#ah)"/>
  <text x="580" y="144" class="flowlabel">validated SQL · artifacts</text>

  <!-- ===== Intelligence layer ===== -->
  <rect x="60" y="160" width="880" height="130" rx="10" class="band"/>
  <text x="76" y="184" class="label">INTELLIGENCE · HOW THE AGENT THINKS</text>
  <g>
    <rect x="76" y="198" width="206" height="76" rx="8" class="chip"/>
    <text x="179" y="228" text-anchor="middle" class="title">Chat Agent + Planner</text>
    <text x="179" y="246" text-anchor="middle" class="sub">plan mode · reasoning</text>
    <rect x="290" y="198" width="206" height="76" rx="8" class="chip"/>
    <text x="393" y="228" text-anchor="middle" class="title">Subagents</text>
    <text x="393" y="246" text-anchor="middle" class="sub">gen_sql · ask_metrics · gen_job</text>
    <text x="393" y="260" text-anchor="middle" class="sub">reports · dashboards · …</text>
    <rect x="504" y="198" width="206" height="76" rx="8" class="chip"/>
    <text x="607" y="228" text-anchor="middle" class="title">Skills &amp; Plugins</text>
    <text x="607" y="246" text-anchor="middle" class="sub">packaged tools · marketplace</text>
    <rect x="718" y="198" width="200" height="76" rx="8" class="chip"/>
    <text x="818" y="228" text-anchor="middle" class="title">Governance</text>
    <text x="818" y="246" text-anchor="middle" class="sub">permissions · sandbox</text>
    <text x="818" y="260" text-anchor="middle" class="sub">SQL policy · tracing</text>
  </g>

  <!-- Intelligence <-> Context -->
  <line x1="430" y1="328" x2="430" y2="290" class="flow-accent" marker-end="url(#ah-accent)"/>
  <text x="420" y="314" text-anchor="end" class="flowlabel-accent">grounded context</text>
  <line x1="570" y1="290" x2="570" y2="328" class="flow-accent" marker-end="url(#ah-accent)"/>
  <text x="580" y="314" class="flowlabel-accent">write back learnings</text>

  <!-- ===== Context engine ===== -->
  <rect x="60" y="330" width="880" height="150" rx="10" class="band-accent"/>
  <text x="76" y="354" class="label-accent">CONTEXT ENGINE · WHAT THE AGENT STANDS ON</text>
  <g>
    <rect x="76" y="368" width="163" height="66" rx="8" class="chip-accent"/>
    <text x="157" y="396" text-anchor="middle" class="title">Schema Metadata</text>
    <text x="157" y="412" text-anchor="middle" class="sub">tables · lineage</text>
    <rect x="247" y="368" width="163" height="66" rx="8" class="chip-accent"/>
    <text x="328" y="396" text-anchor="middle" class="title">Reference SQL</text>
    <text x="328" y="412" text-anchor="middle" class="sub">examples · templates</text>
    <rect x="418" y="368" width="163" height="66" rx="8" class="chip-accent"/>
    <text x="499" y="390" text-anchor="middle" class="title">Semantic Models</text>
    <text x="499" y="406" text-anchor="middle" class="title">&amp; Metrics</text>
    <text x="499" y="422" text-anchor="middle" class="sub">MetricFlow · OSI</text>
    <rect x="589" y="368" width="163" height="66" rx="8" class="chip-accent"/>
    <text x="670" y="396" text-anchor="middle" class="title">Knowledge &amp; Memory</text>
    <text x="670" y="412" text-anchor="middle" class="sub">AGENTS.md · MEMORY.md</text>
    <rect x="760" y="368" width="158" height="66" rx="8" class="chip-accent"/>
    <text x="839" y="396" text-anchor="middle" class="title">Platform Docs</text>
    <text x="839" y="412" text-anchor="middle" class="sub">repos · sites · files</text>
  </g>
  <text x="500" y="462" text-anchor="middle" class="sub">business-domain tree + vector retrieval · LanceDB / PostgreSQL-backed storage</text>

  <!-- Execution path: Intelligence -> tool plane (routed on the left) -->
  <path d="M 60 240 L 34 240 L 34 552 L 58 552" class="flow" marker-end="url(#ah)"/>
  <text x="44" y="498" text-anchor="start" class="flowlabel">runs SQL · jobs · dashboards</text>

  <!-- Feedback loop: Delivery -> Context (routed on the right) -->
  <path d="M 940 84 L 966 84 L 966 404 L 948 404" class="flow-accent" marker-end="url(#ah-accent)"/>
  <text x="962" y="140" text-anchor="end" class="flowlabel-accent">feedback ·</text>
  <text x="962" y="154" text-anchor="end" class="flowlabel-accent">success stories</text>

  <!-- ===== Data & tool plane ===== -->
  <rect x="60" y="520" width="880" height="100" rx="10" class="band"/>
  <text x="76" y="544" class="label">DATA &amp; TOOL PLANE · WHAT THE AGENT CONNECTS TO</text>
  <g>
    <rect x="76" y="558" width="206" height="44" rx="8" class="chip"/>
    <text x="179" y="578" text-anchor="middle" class="title">Databases</text>
    <text x="179" y="594" text-anchor="middle" class="sub">13 engines via adapters</text>
    <rect x="290" y="558" width="206" height="44" rx="8" class="chip"/>
    <text x="393" y="578" text-anchor="middle" class="title">BI Platforms</text>
    <text x="393" y="594" text-anchor="middle" class="sub">Superset · Grafana</text>
    <rect x="504" y="558" width="206" height="44" rx="8" class="chip"/>
    <text x="607" y="578" text-anchor="middle" class="title">Schedulers</text>
    <text x="607" y="594" text-anchor="middle" class="sub">Airflow</text>
    <rect x="718" y="558" width="200" height="44" rx="8" class="chip"/>
    <text x="818" y="578" text-anchor="middle" class="title">LLM Providers</text>
    <text x="818" y="594" text-anchor="middle" class="sub">10+ · per-node assignment</text>
  </g>
</svg>
