<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace">
  <style>
    .win{fill:#171a23;stroke:#2c3040;stroke-width:1}
    .bar{fill:#1f2330}
    .ttl{fill:#7d8598;font-size:12px}
    .prompt{fill:#4ade80;font-size:13px;font-weight:600}
    .q{fill:#e6e9f0;font-size:13px}
    .dim{fill:#7d8598;font-size:12px}
    .ok{fill:#4ade80;font-size:12px}
    .card{fill:#20242f;stroke:#343a4c;stroke-width:1}
    .rt{fill:#c4b5fd;font-size:13px;font-weight:700}
    .k{fill:#7d8598;font-size:13px}
    .v{fill:#e6e9f0;font-size:13px}
    .cur{fill:#4ade80}
    .s1{animation:k1 14s linear infinite}
    .s2{animation:k2 14s linear infinite}
    .s3{animation:k3 14s linear infinite}
    .s4{animation:k4 14s linear infinite}
    .blink{animation:blinkc 1.1s steps(1) infinite}
    @keyframes k1{0%,2%{opacity:0}4.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k2{0%,7%{opacity:0}10%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k3{0%,13%{opacity:0}18%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k4{0%,20%{opacity:0}23%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes blinkc{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.s1,.s2,.s3,.s4,.blink{animation:none}}
  </style>

  <rect class="win" x="1" y="1" width="758" height="330" rx="12"/>
  <path class="bar" d="M1 13 A12 12 0 0 1 13 1 H747 A12 12 0 0 1 759 13 V40 H1 Z"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text class="ttl" x="380" y="25" text-anchor="middle">datus</text>

  <g class="s1">
    <text x="28" y="72"><tspan class="prompt">$</tspan><tspan class="q" dx="8">datus plugin install datus-airflow-plugin</tspan></text>
    <text class="ok" x="620" y="72">&#10003; installed</text>
  </g>
  <g class="s2">
    <text x="28" y="102"><tspan class="prompt">$</tspan><tspan class="q" dx="8">datus airflow --help</tspan></text>
    <text class="dim" x="46" y="124">plugin declares CLI commands, skills, and prompt context in datus-plugin.yml</text>
  </g>

  <g class="s3">
    <rect class="card" x="28" y="148" width="704" height="132" rx="8"/>
    <text class="rt" x="52" y="178">One agent, your stack</text>
    <line x1="52" y1="192" x2="708" y2="192" stroke="#343a4c" stroke-width="1"/>
    <text x="52" y="220"><tspan class="k">Connects</tspan><tspan class="v" x="248">15 databases &#183; 10+ LLM providers &#183; MCP server &amp; client</tspan></text>
    <text x="52" y="246"><tspan class="k">Extends</tspan><tspan class="v" x="248">Superset &#183; Grafana &#183; Airflow &#183; in-house tools via plugins</tspan></text>
    <text class="ttl" x="52" y="272">governed: SQL policy with AI pre-review &#183; OS-level sandbox &#183; OTLP traces</text>
  </g>

  <g class="s4">
    <text class="prompt" x="28" y="312">$</text>
    <rect class="blink cur" x="44" y="300" width="8" height="15"/>
  </g>
</svg>
