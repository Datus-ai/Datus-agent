<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace">
  <style>
    .win{fill:#171a23;stroke:#2c3040;stroke-width:1}
    .bar{fill:#1f2330}
    .ttl{fill:#7d8598;font-size:12px}
    .prompt{fill:#4ade80;font-size:13px;font-weight:600}
    .q{fill:#e6e9f0;font-size:13px}
    .tool{fill:#8ea3c8;font-size:13px}
    .fn{fill:#c4b5fd}
    .ok{fill:#4ade80;font-size:12px}
    .card{fill:#20242f;stroke:#343a4c;stroke-width:1}
    .rt{fill:#c4b5fd;font-size:13px;font-weight:700}
    .k{fill:#7d8598;font-size:13px}
    .v{fill:#e6e9f0;font-size:13px}
    .hl{fill:#4ade80;font-size:13px;font-weight:600}
    .cur{fill:#4ade80}
    .s1{animation:k1 14s linear infinite}
    .s2{animation:k2 14s linear infinite}
    .s3{animation:k3 14s linear infinite}
    .s4{animation:k4 14s linear infinite}
    .s5{animation:k5 14s linear infinite}
    .s6{animation:k6 14s linear infinite}
    .blink{animation:blinkc 1.1s steps(1) infinite}
    @keyframes k1{0%,2%{opacity:0}4.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k2{0%,7%{opacity:0}10%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k3{0%,11.5%{opacity:0}14%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k4{0%,16%{opacity:0}18.5%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k5{0%,21%{opacity:0}26%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes k6{0%,28%{opacity:0}31%,92%{opacity:1}96%,100%{opacity:0}}
    @keyframes blinkc{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .s1,.s2,.s3,.s4,.s5,.s6,.blink{animation:none}
    }
  </style>

  <!-- terminal window -->
  <rect class="win" x="1" y="1" width="758" height="414" rx="12"/>
  <path class="bar" d="M1 13 A12 12 0 0 1 13 1 H747 A12 12 0 0 1 759 13 V40 H1 Z"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text class="ttl" x="380" y="25" text-anchor="middle">datus</text>

  <!-- question -->
  <g class="s1">
    <text x="28" y="72"><tspan class="prompt">Datus&gt;</tspan><tspan class="q" dx="8">compare 2014 and 2004, find the reason of population growth</tspan></text>
  </g>

  <!-- tool calls -->
  <g class="s2">
    <text class="tool" x="28" y="106">&#9210; <tspan class="fn">query_metrics</tspan>(total_population, by year)</text>
    <text class="ok" x="660" y="106">&#10003; 0.2s</text>
  </g>
  <g class="s3">
    <text class="tool" x="28" y="132">&#9210; <tspan class="fn">get_dimensions</tspan>(population_growth_rate)</text>
    <text class="ok" x="660" y="132">&#10003; 4 dims</text>
  </g>
  <g class="s4">
    <text class="tool" x="28" y="158">&#9210; <tspan class="fn">attribution_analyze</tspan>(total_population, [region, country])</text>
    <text class="ok" x="660" y="158">&#10003; 0.3s</text>
  </g>

  <!-- report card -->
  <g class="s5">
    <rect class="card" x="28" y="182" width="704" height="164" rx="8"/>
    <text class="rt" x="52" y="212">Population Growth Analysis: 2004 vs 2014</text>
    <line x1="52" y1="226" x2="708" y2="226" stroke="#343a4c" stroke-width="1"/>
    <text x="52" y="254"><tspan class="k">Total population</tspan><tspan class="v" x="248">6.41B &#8594; 7.24B</tspan><tspan class="hl" x="440">+825.6M (+12.9%)</tspan></text>
    <text x="52" y="282"><tspan class="k">Top regions</tspan><tspan class="v" x="248">South Asia 28.4% &#183; Sub-Saharan Africa 28.1%</tspan></text>
    <text x="52" y="310"><tspan class="k">Top country</tspan><tspan class="v" x="248">India +168.9M</tspan><tspan class="hl" x="440">20.5% of total growth</tspan></text>
    <text class="ttl" x="52" y="334">every value resolved from semantic-layer metric definitions</text>
  </g>

  <!-- idle prompt -->
  <g class="s6">
    <text class="prompt" x="28" y="386">Datus&gt;</text>
    <rect class="blink cur" x="92" y="374" width="8" height="15"/>
  </g>
</svg>
