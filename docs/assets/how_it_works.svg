<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="How Datus works: explore, build context, create a subagent, deliver, measure, iterate — with feedback flowing back into context.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .box-accent { fill: #f4f1fd; stroke: #c9bcf5; }
    .num { fill: #654FF0; font-size: 11px; font-weight: 700; }
    .title { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .sub { fill: #57606a; font-size: 10.5px; }
    .flow { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .flow-accent { stroke: #654FF0; stroke-width: 1.5; fill: none; }
    .flowlabel-accent { fill: #654FF0; font-size: 11px; }
    .arrow { fill: #8c959f; }
    .arrow-accent { fill: #654FF0; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .box-accent { fill: #1c1832; stroke: #4c3d8f; }
      .num { fill: #a78bfa; }
      .title { fill: #e6edf3; }
      .sub { fill: #8b949e; }
      .flow { stroke: #6e7681; }
      .flow-accent { stroke: #a78bfa; }
      .flowlabel-accent { fill: #a78bfa; }
      .arrow { fill: #6e7681; }
      .arrow-accent { fill: #a78bfa; }
    }
  </style>
  <defs>
    <marker id="hw-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" class="arrow"/>
    </marker>
    <marker id="hw-ah-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" class="arrow-accent"/>
    </marker>
  </defs>

  <!-- Stage 1: Explore -->
  <rect x="25" y="70" width="140" height="110" rx="10" class="box"/>
  <text x="41" y="94" class="num">1</text>
  <text x="95" y="118" text-anchor="middle" class="title">Explore</text>
  <text x="95" y="140" text-anchor="middle" class="sub">chat with your DB</text>
  <text x="95" y="156" text-anchor="middle" class="sub">@table · @file refs</text>

  <line x1="165" y1="125" x2="185" y2="125" class="flow" marker-end="url(#hw-ah)"/>

  <!-- Stage 2: Build Context -->
  <rect x="187" y="70" width="140" height="110" rx="10" class="box-accent"/>
  <text x="203" y="94" class="num">2</text>
  <text x="257" y="118" text-anchor="middle" class="title">Build Context</text>
  <text x="257" y="140" text-anchor="middle" class="sub">/init · /bootstrap</text>
  <text x="257" y="156" text-anchor="middle" class="sub">/build-kb</text>

  <line x1="327" y1="125" x2="347" y2="125" class="flow" marker-end="url(#hw-ah)"/>

  <!-- Stage 3: Create Subagent -->
  <rect x="349" y="70" width="140" height="110" rx="10" class="box"/>
  <text x="365" y="94" class="num">3</text>
  <text x="419" y="118" text-anchor="middle" class="title">Create Subagent</text>
  <text x="419" y="140" text-anchor="middle" class="sub">/agent manager</text>
  <text x="419" y="156" text-anchor="middle" class="sub">context · tools · rules</text>

  <line x1="489" y1="125" x2="509" y2="125" class="flow" marker-end="url(#hw-ah)"/>

  <!-- Stage 4: Deliver -->
  <rect x="511" y="70" width="140" height="110" rx="10" class="box"/>
  <text x="527" y="94" class="num">4</text>
  <text x="581" y="118" text-anchor="middle" class="title">Deliver</text>
  <text x="581" y="140" text-anchor="middle" class="sub">web · API · MCP</text>
  <text x="581" y="156" text-anchor="middle" class="sub">Slack · Feishu · IDE</text>

  <line x1="651" y1="125" x2="671" y2="125" class="flow" marker-end="url(#hw-ah)"/>

  <!-- Stage 5: Measure -->
  <rect x="673" y="70" width="140" height="110" rx="10" class="box"/>
  <text x="689" y="94" class="num">5</text>
  <text x="743" y="118" text-anchor="middle" class="title">Measure</text>
  <text x="743" y="140" text-anchor="middle" class="sub">BIRD · Spider 2.0</text>
  <text x="743" y="156" text-anchor="middle" class="sub">accuracy over time</text>

  <line x1="813" y1="125" x2="833" y2="125" class="flow" marker-end="url(#hw-ah)"/>

  <!-- Stage 6: Iterate -->
  <rect x="835" y="70" width="140" height="110" rx="10" class="box"/>
  <text x="851" y="94" class="num">6</text>
  <text x="905" y="118" text-anchor="middle" class="title">Iterate</text>
  <text x="905" y="140" text-anchor="middle" class="sub">fix SQL · add rules</text>
  <text x="905" y="156" text-anchor="middle" class="sub">refine semantics</text>

  <!-- Feedback loop: Iterate back to Build Context -->
  <path d="M 905 180 L 905 232 L 257 232 L 257 186" class="flow-accent" marker-end="url(#hw-ah-accent)"/>
  <text x="581" y="252" text-anchor="middle" class="flowlabel-accent">analyst feedback and success stories flow back into context — the agent gets more accurate over time</text>
</svg>
