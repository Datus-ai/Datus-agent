name: "Code Quality"
run-name: >-
  Validate PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} base:${{ github.event.pull_request.base.ref }}@${{ github.event.pull_request.base.sha }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-check:
    uses: ./.github/workflows/python-format-check.yml

  run-coverage:
    needs: format-check
    uses: ./.github/workflows/run-ut-and-coverage.yml
