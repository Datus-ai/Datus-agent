name: "Release Candidate Validation"

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Expected datus-agent version on this branch, for example 0.3.1 or 0.3.1rc1"
        required: true
        type: string
      run_stable_benchmark:
        description: "Run the baisheng stable benchmark against the built wheel"
        required: false
        default: true
        type: boolean
      benchmark_task_ids:
        description: "Optional space-separated task IDs. Overrides the stable case group when set."
        required: false
        default: ""
        type: string
      benchmark_model:
        description: "Optional model override for benchmark runs"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      expected_version:
        required: true
        type: string
      run_stable_benchmark:
        required: false
        default: true
        type: boolean
      benchmark_task_ids:
        required: false
        default: ""
        type: string
      benchmark_model:
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}-${{ inputs.expected_version }}
  cancel-in-progress: false

env:
  RELEASE_CANDIDATE_WHEEL_ARTIFACT: datus-agent-release-candidate-wheel-${{ github.run_id }}

jobs:
  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build packaging

      - name: Check source release metadata
        run: |
          python ci/check_release_readiness.py \
            --expected-version "${{ inputs.expected_version }}" \
            --check-tag-available \
            --check-adapter-latest

      - name: Build release candidate wheel
        run: python -m build --wheel --outdir dist-release-candidate

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv .release-smoke-venv
          source .release-smoke-venv/bin/activate
          python -m pip install --upgrade pip packaging
          python -m pip install dist-release-candidate/*.whl

          python ci/check_release_readiness.py \
            --expected-version "${{ inputs.expected_version }}" \
            --check-installed-metadata \
            --check-console-versions

          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python - <<'PY'
          import datus
          from datus.cli.main import ArgumentParser

          print(f"datus import smoke passed: {datus.__version__}")
          ArgumentParser()
          PY

      - name: Upload release candidate wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_CANDIDATE_WHEEL_ARTIFACT }}
          path: dist-release-candidate/*.whl
          retention-days: 7

  stable-benchmark:
    name: Stable benchmark
    needs: package-smoke
    if: ${{ inputs.run_stable_benchmark }}
    runs-on: self-hosted
    timeout-minutes: 360
    env:
      BENCHMARK_SCENARIO: baisheng
      BENCHMARK_CONTEXT_TYPE: all
      BENCHMARK_TASK_IDS: ${{ inputs.benchmark_task_ids }}
      BENCHMARK_CASE_GROUP: stable
      BENCHMARK_MAX_STEPS: "30"
      BENCHMARK_MAX_WORKERS: "2"
      BENCHMARK_TARGET: ""
      BENCHMARK_MODEL: ${{ inputs.benchmark_model }}
      MIN_QUERY_SCORE: "0.80"
      ENFORCE_QUERY_SCORE: "false"
      BENCHMARK_STARROCKS_CONTAINER: datus-agent-rc-starrocks-${{ github.run_id }}
      BENCHMARK_STARROCKS_QUERY_PORT: "19030"
      BENCHMARK_STARROCKS_HTTP_PORT: "18030"
      BENCHMARK_ARTIFACT_NAME: release-candidate-benchmark-baisheng-run_${{ github.run_id }}_${{ github.run_number }}
    steps:
      - name: Checkout datus-agent
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout datus-benchmark
        uses: actions/checkout@v4
        with:
          repository: "Datus-ai/datus-benchmark"
          path: "datus-benchmark"
          ref: "main"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download release candidate wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_CANDIDATE_WHEEL_ARTIFACT }}
          path: dist-release-candidate

      - name: Install release candidate wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip packaging
          python -m pip install dist-release-candidate/*.whl
          python -m pip install pytest pandas pyyaml langsmith
          python -m pip install --upgrade datus-starrocks datus-sqlalchemy datus-mysql

          python ci/check_release_readiness.py \
            --expected-version "${{ inputs.expected_version }}" \
            --check-installed-metadata \
            --check-console-versions

      - name: Validate benchmark harness
        shell: bash
        working-directory: datus-benchmark
        run: |
          python scripts/validate_scenarios.py --scenario "${BENCHMARK_SCENARIO}"
          python -m pytest tests/unit -q

      - name: Load environment variables
        shell: bash
        run: |
          echo "Loading environment variables from /home/datus_ci/ci_template/ci.env"
          if [[ -f /home/datus_ci/ci_template/ci.env ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%$'\r'}"
              trimmed="${line#"${line%%[![:space:]]*}"}"
              if [[ -n "$trimmed" && ! "$trimmed" =~ ^# ]]; then
                if [[ "$trimmed" != *=* ]]; then
                  echo "Skipping invalid env line without '='"
                  continue
                fi
                var_name="${trimmed%%=*}"
                var_value="${trimmed#*=}"
                var_name="${var_name#"${var_name%%[![:space:]]*}"}"
                var_name="${var_name%"${var_name##*[![:space:]]}"}"
                if [[ -z "$var_name" ]]; then
                  echo "Skipping invalid env line with empty name"
                  continue
                fi
                if [[ -n "$var_value" ]]; then
                  echo "::add-mask::$var_value"
                fi
                echo "Loading variable: $var_name"
                printf '%s=%s\n' "$var_name" "$var_value" >> "$GITHUB_ENV"
              fi
            done < /home/datus_ci/ci_template/ci.env
          else
            echo "Missing /home/datus_ci/ci_template/ci.env"
            exit 1
          fi
          echo "Environment variables loaded successfully"

      - name: Ensure Docker runtime
        shell: bash
        run: |
          docker --version
          docker info >/dev/null

      - name: Prepare benchmark data
        shell: bash
        run: |
          echo "BENCHMARK_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          ARTIFACT_ROOT="$GITHUB_WORKSPACE/release_candidate_benchmark_artifacts"
          rm -rf "$ARTIFACT_ROOT"
          rm -f "$GITHUB_WORKSPACE"/release_candidate_benchmark_output_*.log
          RUN_DIR="$ARTIFACT_ROOT/run_${{ github.run_id }}_${{ github.run_number }}"
          mkdir -p "$RUN_DIR"
          echo "BENCHMARK_RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"

          benchmark_csv="$GITHUB_WORKSPACE/datus-benchmark/${BENCHMARK_SCENARIO}/benchmark/${BENCHMARK_SCENARIO}.csv"
          agent_config="$GITHUB_WORKSPACE/datus-benchmark/${BENCHMARK_SCENARIO}/conf/agent.yml"

          if [[ ! -f "$benchmark_csv" ]]; then
            echo "Benchmark CSV not found: $benchmark_csv"
            exit 1
          fi
          if [[ ! -f "$agent_config" ]]; then
            echo "Agent config not found: $agent_config"
            exit 1
          fi

          mkdir -p "$HOME/.datus/benchmark/${BENCHMARK_SCENARIO}"
          cp "$benchmark_csv" "$HOME/.datus/benchmark/${BENCHMARK_SCENARIO}/"
          echo "DATUS_AGENT_CONFIG=$agent_config" >> "$GITHUB_ENV"

      - name: Prepare benchmark environment
        shell: bash
        working-directory: datus-benchmark
        run: bash scripts/prepare_scenario_environment.sh "${BENCHMARK_SCENARIO}"

      - name: Run stable benchmark
        id: run_benchmark
        shell: bash
        working-directory: datus-benchmark
        run: |
          set +e

          LOG_FILE="release_candidate_benchmark_output_$(date +%Y%m%d_%H%M%S).log"
          echo "log_file=$LOG_FILE" >> "$GITHUB_OUTPUT"

          TASK_ARGS=()
          if [[ -n "${BENCHMARK_TASK_IDS}" ]]; then
            read -r -a TASK_ID_ARRAY <<< "${BENCHMARK_TASK_IDS}"
            TASK_ARGS=(--task-ids "${TASK_ID_ARRAY[@]}")
          fi

          CASE_GROUP_ARGS=()
          if [[ -z "${BENCHMARK_TASK_IDS}" && -n "${BENCHMARK_CASE_GROUP}" ]]; then
            CASE_GROUP_ARGS=(--case-group "${BENCHMARK_CASE_GROUP}")
          fi

          TARGET_ARGS=()
          if [[ -n "${BENCHMARK_TARGET}" ]]; then
            TARGET_ARGS+=(--target "${BENCHMARK_TARGET}")
          fi
          if [[ -n "${BENCHMARK_MODEL}" ]]; then
            TARGET_ARGS+=(--model "${BENCHMARK_MODEL}")
          fi

          python scripts/run_and_evaluate.py \
            --benchmark "${BENCHMARK_SCENARIO}" \
            --context-type "${BENCHMARK_CONTEXT_TYPE}" \
            --full \
            --include-retrieval-in-full \
            --max-steps "${BENCHMARK_MAX_STEPS}" \
            --max-workers "${BENCHMARK_MAX_WORKERS}" \
            --output "${BENCHMARK_RUN_DIR}/evaluation.json" \
            --verbose \
            "${TASK_ARGS[@]}" \
            "${CASE_GROUP_ARGS[@]}" \
            "${TARGET_ARGS[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/$LOG_FILE"

          benchmark_exit_code=${PIPESTATUS[0]}
          echo "benchmark_exit_code=$benchmark_exit_code" >> "$GITHUB_OUTPUT"
          echo "Benchmark exit code: $benchmark_exit_code"
          exit 0

      - name: Generate stable benchmark report
        id: stable_benchmark_report
        if: always()
        shell: bash
        env:
          BENCHMARK_EXIT_CODE: ${{ steps.run_benchmark.outputs.benchmark_exit_code || '1' }}
        run: |
          if [[ -z "${BENCHMARK_RUN_DIR:-}" ]]; then
            BENCHMARK_RUN_DIR="$GITHUB_WORKSPACE/release_candidate_benchmark_artifacts/run_${{ github.run_id }}_${{ github.run_number }}"
            mkdir -p "$BENCHMARK_RUN_DIR"
            echo "BENCHMARK_RUN_DIR=$BENCHMARK_RUN_DIR" >> "$GITHUB_ENV"
          fi

          benchmark_sha="$(git -C datus-benchmark rev-parse HEAD 2>/dev/null || echo unknown)"
          datus_agent_sha="$(git rev-parse HEAD 2>/dev/null || echo unknown)"

          REPORT_CASE_GROUP="${BENCHMARK_CASE_GROUP}"
          if [[ -n "${BENCHMARK_TASK_IDS}" ]]; then
            REPORT_CASE_GROUP="none"
          fi

          cd datus-benchmark
          python scripts/generate_weekly_report.py \
            --scenario "${BENCHMARK_SCENARIO}" \
            --evaluation-json "${BENCHMARK_RUN_DIR}/combined_evaluation.json" \
            --evaluation-json "${BENCHMARK_RUN_DIR}/evaluation.json" \
            --summary-report "${BENCHMARK_RUN_DIR}/summary_report.txt" \
            --benchmark-exit-code "${BENCHMARK_EXIT_CODE}" \
            --output-json "${BENCHMARK_RUN_DIR}/weekly_benchmark_report.json" \
            --output-markdown "${BENCHMARK_RUN_DIR}/weekly_benchmark_report.md" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --github-run-id "${{ github.run_id }}" \
            --benchmark-sha "$benchmark_sha" \
            --datus-agent-sha "$datus_agent_sha" \
            --context-type "${BENCHMARK_CONTEXT_TYPE}" \
            --task-ids "${BENCHMARK_TASK_IDS}" \
            --case-group "$REPORT_CASE_GROUP" \
            --target "${BENCHMARK_TARGET}" \
            --model "${BENCHMARK_MODEL}"

          BENCHMARK_ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/generate_run_artifacts.py \
            --scenario "${BENCHMARK_SCENARIO}" \
            --weekly-report-json "${BENCHMARK_RUN_DIR}/weekly_benchmark_report.json" \
            --evaluation-json "${BENCHMARK_RUN_DIR}/combined_evaluation.json" \
            --evaluation-json "${BENCHMARK_RUN_DIR}/evaluation.json" \
            --output-dir "${BENCHMARK_RUN_DIR}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --github-run-id "${{ github.run_id }}" \
            --github-run-attempt "${{ github.run_attempt }}" \
            --event-name "${{ github.event_name }}" \
            --repository "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --ref "${{ github.ref }}" \
            --sha "${{ github.sha }}" \
            --benchmark-sha "$benchmark_sha" \
            --datus-agent-sha "$datus_agent_sha" \
            --context-type "${BENCHMARK_CONTEXT_TYPE}" \
            --task-ids "${BENCHMARK_TASK_IDS}" \
            --case-group "$REPORT_CASE_GROUP" \
            --target "${BENCHMARK_TARGET}" \
            --model "${BENCHMARK_MODEL}" \
            --max-steps "${BENCHMARK_MAX_STEPS}" \
            --max-workers "${BENCHMARK_MAX_WORKERS}" \
            --started-at "${BENCHMARK_STARTED_AT:-}" \
            --ended-at "$BENCHMARK_ENDED_AT" \
            --benchmark-exit-code "${BENCHMARK_EXIT_CODE}" \
            --artifact-name "${BENCHMARK_ARTIFACT_NAME}" \
            --runner-name "${RUNNER_NAME:-}" \
            --runner-os "${RUNNER_OS:-}" \
            --runner-arch "${RUNNER_ARCH:-}"

          cat "${BENCHMARK_RUN_DIR}/weekly_benchmark_report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stable benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.BENCHMARK_ARTIFACT_NAME }}
          path: |
            release_candidate_benchmark_artifacts/**
            release_candidate_benchmark_output_*.log
          retention-days: 30

      - name: Cleanup benchmark environment
        if: always()
        shell: bash
        env:
          BENCHMARK_DUMP_ENV_DIAGNOSTICS: ${{ steps.stable_benchmark_report.outputs.status != 'passed' && '1' || '0' }}
        working-directory: datus-benchmark
        run: bash scripts/cleanup_scenario_environment.sh

      - name: Fail on stable benchmark harness failure
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.stable_benchmark_report.outputs.status }}" != "passed" ]]; then
            echo "Release candidate stable benchmark failed with classification: ${{ steps.stable_benchmark_report.outputs.classification }}"
            exit 1
          fi
