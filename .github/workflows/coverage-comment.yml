name: Coverage Comment

on:
  workflow_run:
    workflows: ["Code Quality"]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted comment script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download PR coverage data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-comment-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/coverage-comment

      - name: Post validated coverage comment
        uses: actions/github-script@v7
        env:
          COVERAGE_ARTIFACT_DIR: ${{ runner.temp }}/coverage-comment
        with:
          script: |
            const post = require('./ci/post-coverage-comment.js');
            await post({ github, context, core, artifactDir: process.env.COVERAGE_ARTIFACT_DIR });
