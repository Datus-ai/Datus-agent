name: "Test Audit"

# The trusted base auditor statically reads PR files. PR code is never executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/unit_tests/**/test_*.py'
      - 'tests/integration/**/test_*.py'

concurrency:
  group: test-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base repo (trusted code — runs the auditor)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout PR head (untrusted data — never executed)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Fetch comparison base inside pr/
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch origin "$BASE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test audit (trusted auditor against PR data)
        id: audit
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 ../base/ci/audit_tests.py \
            --repo-root . \
            --diff-only "$BASE_SHA" \
            --json ../base/ci/audit-report.json \
            --github-output

      - name: Post audit comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            process.chdir('base');
            const script = require('./ci/post-audit-comment.js');
            await script({ github, context, core });

      - name: Fail job if audit did not complete or found blocking issues
        if: ${{ always() && (steps.audit.outcome != 'success' || steps.audit.outputs.audit_outcome == 'failure') }}
        run: |
          if [ "${{ steps.audit.outcome }}" != "success" ]; then
            echo "::error::Test audit did not complete cleanly (outcome=${{ steps.audit.outcome }})."
          else
            echo "::error::Test audit found blocking issues (P0=${{ steps.audit.outputs.p0_count }}, P1=${{ steps.audit.outputs.p1_count }}). See PR comment for details."
          fi
          exit 1
