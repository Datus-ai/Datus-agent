name: "Coverage Check"
on:
  workflow_dispatch:
  workflow_call:

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name }}"
          BASE_REF="${BASE_REF#refs/heads/}"
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: |
          uv sync --locked --group ci
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Check release metadata
        run: python3 ci/check_release_readiness.py

      - name: Check CI comment boundaries
        run: node --test ci/post-coverage-comment.test.js ci/merge-queue-ref.test.js

      - name: Validate harness coverage map
        run: |
          set +e
          python3 ci/harness/validate_coverage_map.py \
            --strict \
            --report-json ci/harness/coverage-map-report.json \
            --report-md ci/harness/coverage-map-report.md
          validation_exit=$?
          set -e
          if [ -f ci/harness/coverage-map-report.md ]; then
            cat ci/harness/coverage-map-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$validation_exit"

      - name: Setup config file
        run: |
          cp conf/agent.yml.example conf/agent.yml

      - name: Restore tracked test config
        run: git restore --source=HEAD --worktree --staged tests/conf/agent.yml

      - name: Isolate test data directory
        run: |
          DATUS_TEST_HOME="${GITHUB_WORKSPACE}/.datus_test_data"
          echo "DATUS_TEST_HOME=$DATUS_TEST_HOME" >> "$GITHUB_ENV"
          sed -i "s|home: .datus_test_data|home: $DATUS_TEST_HOME|g" tests/conf/agent.yml
          sed -i "s|project_root: .datus_test_data/workspace|project_root: $DATUS_TEST_HOME/workspace|g" tests/conf/agent.yml

      - name: Prepare small BIRD test fixtures
        run: |
          DATUS_TEST_BIRD_ROOT="$RUNNER_TEMP/datus-ci-bird/dev_databases"
          python3 ci/prepare_ci_bird.py "$DATUS_TEST_BIRD_ROOT"
          echo "DATUS_TEST_BIRD_ROOT=$DATUS_TEST_BIRD_ROOT" >> "$GITHUB_ENV"

      - name: Pre-install the DuckDB excel extension
        run: |
          # `read_xlsx` lives in an autoloadable extension DuckDB fetches over
          # HTTPS on first use. Fetching it from inside a test would make the
          # spreadsheet suite network-dependent, which CI tests must not be — so
          # it is installed once here, and the tests then LOAD it locally. Same
          # posture as the runtime image, which bakes it for egress-less pods.
          EXT_DIR="${GITHUB_WORKSPACE}/.duckdb/extensions"
          echo "DATUS_DUCKDB_EXTENSION_DIRECTORY=$EXT_DIR" >> "$GITHUB_ENV"
          uv run python - <<'PY'
          import os
          import duckdb

          ext_dir = os.path.join(os.environ["GITHUB_WORKSPACE"], ".duckdb", "extensions")
          con = duckdb.connect(":memory:")
          con.execute(f"SET extension_directory='{ext_dir}'")
          con.execute("INSTALL excel")
          con.close()

          # Same check the tests will make: load it with autoinstall off, so a
          # failure here is a build failure rather than a mysterious test skip.
          con = duckdb.connect(":memory:")
          con.execute(f"SET extension_directory='{ext_dir}'")
          con.execute("SET autoinstall_known_extensions=false")
          con.execute("LOAD excel")
          print(f"duckdb {duckdb.__version__}: excel extension ready in {ext_dir}")
          PY

      - name: Run tests and extract coverage
        id: metrics
        env:
          DATUS_CI_PYTEST_BASETEMP: ${{ runner.temp }}/datus-agent-pytest-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name }}"
          BASE_REF="${BASE_REF#refs/heads/}"
          python3 ci/run-pr-tests.py "$BASE_REF"

      - name: Cleanup pytest temp
        if: always()
        env:
          DATUS_CI_PYTEST_BASETEMP: ${{ runner.temp }}/datus-agent-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          RUNNER_TEMP_ROOT: ${{ runner.temp }}
        run: |
          if [ -z "$DATUS_CI_PYTEST_BASETEMP" ]; then
            exit 0
          fi
          target="$(realpath -m "$DATUS_CI_PYTEST_BASETEMP")"
          runner_temp="$(realpath -m "$RUNNER_TEMP_ROOT")"
          home_dir="$(realpath -m "$HOME")"
          workspace="$(realpath -m "$GITHUB_WORKSPACE")"
          case "$target" in
            "$runner_temp"/*) ;;
            *) echo "Refusing to remove unsafe pytest temp: $target"; exit 0 ;;
          esac
          if [ "$target" = "/" ] || [ "$target" = "$runner_temp" ] || [ "$target" = "$home_dir" ] || [ "$target" = "$workspace" ]; then
            echo "Refusing to remove unsafe pytest temp: $target"
            exit 0
          fi
          rm -rf "$target"

      - name: Prepare coverage comment data
        if: ${{ always() && github.event_name == 'pull_request' && steps.metrics.outputs.test_total != '' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          METRIC_OVERALL: ${{ steps.metrics.outputs.overall }}
          METRIC_DIFF: ${{ steps.metrics.outputs.diff }}
          METRIC_TEST_OUTCOME: ${{ steps.metrics.outputs.test_outcome }}
          METRIC_TEST_TOTAL: ${{ steps.metrics.outputs.test_total }}
          METRIC_TEST_PASSED: ${{ steps.metrics.outputs.test_passed }}
          METRIC_TEST_FAILED: ${{ steps.metrics.outputs.test_failed }}
          METRIC_TEST_SKIPPED: ${{ steps.metrics.outputs.test_skipped }}
        run: python3 ci/write_coverage_comment_data.py

      - name: Upload coverage comment data
        if: ${{ always() && github.event_name == 'pull_request' && steps.metrics.outputs.test_total != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-comment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci/coverage-comment.json
            ci/diff-cover-report.md
            ci/test-report.md
          if-no-files-found: error
          retention-days: 7

      - name: Check coverage thresholds
        if: always() && steps.metrics.outcome != 'cancelled'
        run: |
          python3 -c "
          import sys
          diff = float('${{ steps.metrics.outputs.diff }}')
          test_outcome = '${{ steps.metrics.outputs.test_outcome }}'
          failed = False
          if diff < 80:
              print(f'::error::Diff coverage {diff}% is below the 80% threshold')
              failed = True
          if test_outcome != 'success':
              print('::error::PR acceptance and impacted unit tests did not pass')
              failed = True
          sys.exit(1 if failed else 0)
          "
