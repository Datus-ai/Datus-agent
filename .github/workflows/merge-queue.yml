name: "Merge Queue Gate"

on:
  merge_group:
  workflow_dispatch:

concurrency:
  group: merge-queue-gate-${{ github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic merge queue suites
    runs-on: ubuntu-latest
    outputs:
      policy_required: ${{ steps.policy.outputs.required }}
      policy_cold: ${{ steps.policy.outputs.cold }}
      bi_required: ${{ steps.bi.outputs.required }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Select merge queue profile
        id: profile
        run: uv run --no-project --with pyyaml python ci/select_gate_profile.py --github-output "$GITHUB_OUTPUT"

      - name: Plan required SQL policy acceptance
        id: policy
        if: ${{ steps.profile.outputs.profile == 'code' }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then args+=(--force); fi
          uv run --no-project --with pyyaml python ci/sql_policy_gate.py plan --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Plan required BI acceptance
        id: bi
        if: ${{ steps.profile.outputs.profile == 'code' }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then args+=(--force); fi
          uv run --no-project --with pyyaml python ci/bi_gate.py plan --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Validate generated tool contracts
        run: python3 datus/tools/registry/catalog_builder.py --check

      - name: Install dependencies
        run: |
          if [ "${{ steps.profile.outputs.profile }}" = "code" ] || [ "${{ steps.profile.outputs.ci_tests }}" = "true" ]; then
            uv sync --locked --group ci
          else
            uv venv .venv
            uv pip install pyyaml packaging
          fi
          if [ "${{ steps.profile.outputs.profile }}" = "docs" ]; then
            uv pip install -r requirements-docs.txt
          fi
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Check release metadata
        run: python3 ci/check_release_readiness.py

      - name: Validate harness coverage map
        run: |
          set +e
          python3 ci/harness/validate_coverage_map.py \
            --strict \
            --report-json ci/harness/coverage-map-report.json \
            --report-md ci/harness/coverage-map-report.md
          validation_exit=$?
          set -e
          if [ -f ci/harness/coverage-map-report.md ]; then
            cat ci/harness/coverage-map-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$validation_exit"

      - name: Setup config file
        if: ${{ steps.profile.outputs.profile == 'code' }}
        run: |
          cp conf/agent.yml.example conf/agent.yml

      - name: Restore tracked test config
        if: ${{ steps.profile.outputs.profile == 'code' }}
        run: git restore --source=HEAD --worktree --staged tests/conf/agent.yml

      - name: Isolate test data directory
        if: ${{ steps.profile.outputs.profile == 'code' }}
        run: |
          DATUS_TEST_HOME="${GITHUB_WORKSPACE}/.datus_test_data"
          echo "DATUS_TEST_HOME=$DATUS_TEST_HOME" >> "$GITHUB_ENV"
          sed -i "s|home: .datus_test_data|home: $DATUS_TEST_HOME|g" tests/conf/agent.yml
          sed -i "s|project_root: .datus_test_data/workspace|project_root: $DATUS_TEST_HOME/workspace|g" tests/conf/agent.yml

      - name: Prepare small BIRD test fixtures
        if: ${{ steps.profile.outputs.profile == 'code' }}
        run: |
          DATUS_TEST_BIRD_ROOT="$RUNNER_TEMP/datus-ci-bird/dev_databases"
          python3 ci/prepare_ci_bird.py "$DATUS_TEST_BIRD_ROOT"
          echo "DATUS_TEST_BIRD_ROOT=$DATUS_TEST_BIRD_ROOT" >> "$GITHUB_ENV"

      - name: Run deterministic merge queue suites
        env:
          DATUS_CI_PYTEST_BASETEMP: ${{ runner.temp }}/datus-agent-pytest-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 ci/run-merge-queue-tests.py

      - name: Cleanup pytest temp
        if: ${{ always() }}
        env:
          DATUS_CI_PYTEST_BASETEMP: ${{ runner.temp }}/datus-agent-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          RUNNER_TEMP_ROOT: ${{ runner.temp }}
        run: |
          if [ -z "$DATUS_CI_PYTEST_BASETEMP" ]; then
            exit 0
          fi
          target="$(realpath -m "$DATUS_CI_PYTEST_BASETEMP")"
          runner_temp="$(realpath -m "$RUNNER_TEMP_ROOT")"
          home_dir="$(realpath -m "$HOME")"
          workspace="$(realpath -m "$GITHUB_WORKSPACE")"
          case "$target" in
            "$runner_temp"/*) ;;
            *) echo "Refusing to remove unsafe pytest temp: $target"; exit 0 ;;
          esac
          if [ "$target" = "/" ] || [ "$target" = "$runner_temp" ] || [ "$target" = "$home_dir" ] || [ "$target" = "$workspace" ]; then
            echo "Refusing to remove unsafe pytest temp: $target"
            exit 0
          fi
          rm -rf "$target"

      - name: Upload merge queue artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: merge-queue-results
          path: |
            ci/merge-queue-results.json
            ci/gate-coverage.json
            ci/test-results-*.execution.json
            ci/test-results-merge-*.xml

  sql-policy:
    needs: deterministic
    if: ${{ needs.deterministic.outputs.policy_required == 'true' }}
    uses: ./.github/workflows/sql-policy-gate.yml
    with:
      agent_ref: ${{ github.sha }}
      cold: ${{ needs.deterministic.outputs.policy_cold == 'true' }}
    secrets:
      RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}

  bi:
    needs: deterministic
    if: ${{ needs.deterministic.outputs.bi_required == 'true' }}
    uses: ./.github/workflows/bi-gate.yml
    with:
      agent_ref: ${{ github.sha }}
    secrets:
      RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}

  merge-queue-gate:
    name: Merge Queue Gate
    needs: [deterministic, sql-policy, bi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected gate to succeed
        env:
          DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
          POLICY_REQUIRED: ${{ needs.deterministic.outputs.policy_required }}
          POLICY_RESULT: ${{ needs.sql-policy.result }}
          BI_REQUIRED: ${{ needs.deterministic.outputs.bi_required }}
          BI_RESULT: ${{ needs.bi.result }}
        run: |
          test "$DETERMINISTIC_RESULT" = success
          if [ "$POLICY_REQUIRED" = true ]; then
            test "$POLICY_RESULT" = success
          else
            test "$POLICY_RESULT" = skipped
          fi
          if [ "$BI_REQUIRED" = true ]; then
            test "$BI_RESULT" = success
          else
            test "$BI_RESULT" = skipped
          fi
